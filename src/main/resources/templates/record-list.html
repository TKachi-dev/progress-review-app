<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>進捗一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>進捗一覧</h1>

        <div th:if="${#lists.isEmpty(records)}">
            <p>記録がありません</p>
        </div>

        <table th:if="${not #lists.isEmpty(records)}">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>タイトル</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${record.date}"></td>
                    <td>
                        <a th:href="@{/records/{id}(id=${record.id})}"
                           th:text="${record.title}"></a>
                    </td>
                </tr>
            </tbody>
        </table>

        <p>
            <a th:href="@{/records/new}" class="button">新しく記録する</a>
        </p>

        <p>
            <a th:href="@{/}" class="button">ホームへ戻る</a>
        </p>
    </div>
</body>
</html>
