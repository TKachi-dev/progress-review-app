<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>進捗記録登録</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>進捗記録登録</h1>

        <form th:action="@{/records}" th:object="${record}" method="post">
            <div>
                <label for="date">日付</label><br>
                <input type="date" id="date" th:field="*{date}">
            </div>

            <div>
                <label for="didWhat">やったこと</label><br>
                <textarea id="didWhat" th:field="*{didWhat}"></textarea>
            </div>

            <div>
                <label for="nextAction">次やること</label><br>
                <textarea id="nextAction" th:field="*{nextAction}"></textarea>
            </div>

            <div>
                <label for="blockedPoint">詰まったポイント</label><br>
                <textarea id="blockedPoint" th:field="*{blockedPoint}"></textarea>
            </div>

            <div>
                <button type="submit">登録</button>
            </div>
        </form>

        <p>
            <a th:href="@{/}" class="button">ホームへ戻る</a>
        </p>
    </div>
</body>
</html>
